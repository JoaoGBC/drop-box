[tool.poetry]
name = "drop-box"
version = "0.1.0"
description = ""
authors = ["Joao Gabriel <joao.gabriel156@hotmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["standard"], version = "^0.115.13"}
pydantic-settings = "^2.9.1"
pytest-cov = "^6.2.1"
gevent = "^25.5.1"
boto3 = "^1.38.40"
tzlocal = "^5.3.1"
pyjwt = "^2.10.1"


[tool.poetry.group.dev.dependencies]
taskipy = "^1.14.1"
ruff = "^0.12.0"
pytest-asyncio = "^1.0.0"
boto3-stubs = {extras = ["s3"], version = "^1.38.41"}

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'

[tool.coverage.run]
concurrency = ["gevent"]

[tool.taskipy.tasks]
lint = 'ruff check .; ruff check . --diff'
format = 'ruff check . --fix; ruff format .'
run = 'PYTHONPATH=drop_box fastapi dev drop_box/app.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=fast_zero -vv'
post_test = 'coverage html'

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
